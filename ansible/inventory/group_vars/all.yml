teacher_repo_local_path: "{{ playbook_dir | dirname | dirname }}"

# Compose project name; the containers are <name>-<service>-1. Keep in sync with the
# COMPOSE_PROJECT_NAME that teacher_stack templates into the stack's .env.
teacher_project_name: teacher-agent

teacher_mount_point: /mnt/library
teacher_stack_dir: /opt/teacher-agent
teacher_data_dir: /srv/teacher-agent

# The private services (api, ingestion, voice, qdrant, ollama) publish no host ports:
# the compose defines an `internal: true` network for them, so they have no route to
# the internet, and only the compose proxy exposes ports. Remote access is VPN-only.
# Override these when the phone's VPN needs a different name or port.
teacher_proxy_host: localhost
teacher_proxy_bind: 127.0.0.1
teacher_https_port: 8443
teacher_proxy_http_port: 8088
teacher_tls: internal

teacher_gpu_enabled: false
teacher_gpu_vendor: nvidia
teacher_llm_runtime: ollama
teacher_llm_model: qwen2.5:7b-instruct-q4_K_M
teacher_vector_db: qdrant
teacher_enable_voice: false
teacher_enable_reverse_proxy: false
teacher_enable_wireguard: false
teacher_compose_overlays: []

teacher_embedding_model: intfloat/multilingual-e5-base
teacher_embedding_device: cpu
teacher_retrieval_top_k: 6
teacher_max_context_chars: 18000
teacher_ingest_schedule_seconds: 0
teacher_ingest_remove_missing: true
teacher_ingest_scan_extensions: ".pdf,.epub,.txt,.md,.docx,.mobi,.azw,.azw3"
teacher_ingest_chunk_size: 1200
teacher_ingest_chunk_overlap: 200
# Contents of config/ingestion/ingestion.yml on the host: `watch` (folders to index) and `schedule`,
# same format as config/ingestion/ingestion.example.yml. Left empty, deploy keeps the file already
# on the host (or one copied from your checkout); without any file nothing is indexed.
# Example:
#   teacher_ingest_config:
#     schedule: {enabled: true, cron: "30 2 * * *", timezone: Europe/Budapest}
#     watch:
#       exclude: ["#recycle", "@eaDir"]
#       folders: [{path: Books}, {path: Scans}]
teacher_ingest_config: {}
teacher_study_top_k: 10
teacher_study_max_attempts: 2

# `username:argon2-hash` entries separated by `;` (see docs/security.md). Keep real values in Vault.
teacher_auth_users: ""
teacher_auth_disabled: false
teacher_session_ttl_hours: 720
teacher_cookie_secure: auto
teacher_login_max_attempts: 10
teacher_login_window_seconds: 900
# Left empty, deploy keeps the token already on the host or generates a new one.
teacher_ingest_token: ""

teacher_voice_stt_backend: faster-whisper
teacher_voice_stt_model: base
teacher_voice_stt_device: auto
teacher_voice_tts_backend: disabled

teacher_ocr_enabled: true
teacher_ocr_dpi: 300
teacher_ocr_language: hun+eng
teacher_ocr_min_chars: 50
teacher_ocr_timeout_seconds: 900
teacher_ocr_max_pages: 0

teacher_share_enabled: true
share_type: cifs
share_server: nas.local
share_path: /library
mount_options: ""
read_only: true
teacher_share_credentials_file: /root/.smb-teacher-agent
teacher_share_credentials_username: ""
teacher_share_credentials_password: ""
teacher_share_credentials_domain: ""

teacher_caddy_domain: teacher.example.internal
teacher_caddy_email: admin@example.com
teacher_caddy_username: ""
teacher_caddy_password_hash: ""


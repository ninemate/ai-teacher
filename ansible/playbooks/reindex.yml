# The ingestion service sits on the internal compose network and publishes no host
# port, so the API calls from inside the network; this playbook asks it directly
# through `docker compose exec`. The token comes from the container's own environment.
- hosts: teacher
  become: true
  tasks:
    - name: Trigger manual reindex
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - .env
          - -f
          - compose/docker-compose.yml
          - exec
          - -T
          - ingestion
          - python
          - -c
          - >-
            import os, urllib.request;
            r = urllib.request.Request('http://127.0.0.1:8081/ingest/reindex',
                headers={'Authorization': 'Bearer ' + os.environ['TEACHER_INGEST_TOKEN'],
                         'Content-Type': 'application/json'});
            body = b'{"full_reindex": false, "remove_missing": true}';
            print(urllib.request.urlopen(r, data=body, timeout=600).read().decode())
        chdir: "{{ teacher_stack_dir }}"
      # The container answers with a JSON summary of the run; it is not secret
      # (the token lives in the container's environment and is never printed).
      changed_when: false
      register: reindex_result
      failed_when: reindex_result.rc != 0

    - name: Show reindex response
      ansible.builtin.debug:
        var: reindex_result.stdout

- name: Build effective compose overlay list
  # docker-compose.proxy.yml is always part of the stack: the private services publish
  # no host ports, so the compose proxy is the only entry point.
  ansible.builtin.set_fact:
    teacher_effective_compose_files: >-
      {{
        ['compose/docker-compose.yml', 'compose/docker-compose.proxy.yml']
        + teacher_compose_overlays
        + (['compose/docker-compose.nvidia.example.yml'] if teacher_gpu_enabled | bool else [])
        + (['compose/docker-compose.voice.example.yml'] if teacher_enable_voice | bool else [])
      }}

- name: Ensure teacher stack directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ teacher_stack_dir }}"
    - "{{ teacher_mount_point }}"
    - "{{ teacher_data_dir }}"
    - "{{ teacher_data_dir }}/qdrant"
    - "{{ teacher_data_dir }}/ollama"
    - "{{ teacher_data_dir }}/metadata"
    - "{{ teacher_data_dir }}/logs"
    - "{{ teacher_data_dir }}/cache"
    - "{{ teacher_data_dir }}/models"

- name: Copy compose directory
  ansible.builtin.copy:
    src: "{{ teacher_repo_local_path }}/compose/"
    dest: "{{ teacher_stack_dir }}/compose/"
    mode: preserve

- name: Copy config directory
  ansible.builtin.copy:
    src: "{{ teacher_repo_local_path }}/config/"
    dest: "{{ teacher_stack_dir }}/config/"
    mode: preserve

- name: Write the ingestion config (watched folders, schedule)
  ansible.builtin.copy:
    content: "{{ teacher_ingest_config | to_nice_yaml(indent=2) }}"
    dest: "{{ teacher_stack_dir }}/config/ingestion/ingestion.yml"
    mode: "0644"
  register: teacher_ingest_config_written
  when: teacher_ingest_config | length > 0

- name: Check for an ingestion config on the host
  ansible.builtin.stat:
    path: "{{ teacher_stack_dir }}/config/ingestion/ingestion.yml"
  register: teacher_ingest_config_file

- name: Warn when no folders are watched
  ansible.builtin.debug:
    msg: >-
      {{ teacher_stack_dir }}/config/ingestion/ingestion.yml does not exist, so the ingestion service
      watches no folders and indexes nothing. Set teacher_ingest_config or create the file.
  when: not teacher_ingest_config_file.stat.exists

- name: Remove __pycache__ from source services
  ansible.builtin.command:
    cmd: find "{{ teacher_repo_local_path }}/services" -type d -name __pycache__ -exec rm -rf {} +
  register: cleanup_result
  changed_when: false
  failed_when: false

- name: Copy services directory
  ansible.builtin.copy:
    src: "{{ teacher_repo_local_path }}/services/"
    dest: "{{ teacher_stack_dir }}/services/"
    mode: preserve

- name: Copy scripts directory (egress test, model updates)
  ansible.builtin.copy:
    src: "{{ teacher_repo_local_path }}/scripts/"
    dest: "{{ teacher_stack_dir }}/scripts/"
    mode: preserve

- name: Read the current environment file
  ansible.builtin.slurp:
    src: "{{ teacher_stack_dir }}/.env"
  register: teacher_current_env
  failed_when: false

- name: Keep or generate the ingestion token
  ansible.builtin.set_fact:
    teacher_ingest_token_effective: >-
      {{ teacher_ingest_token
         or (teacher_current_env.content | default('') | b64decode
             | regex_findall('(?m)^TEACHER_INGEST_TOKEN=(\S+)$') | first | default(''))
         or lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}
  no_log: true

- name: Template environment file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ teacher_stack_dir }}/.env"
    mode: "0600"

- name: Start teacher-agent stack
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file .env
      {% for item in teacher_effective_compose_files %}-f {{ item }} {% endfor %}
      up -d --build
    chdir: "{{ teacher_stack_dir }}"
  register: teacher_stack_up
  changed_when: >-
    'Started' in teacher_stack_up.stdout or
    'Recreated' in teacher_stack_up.stdout or
    'Built' in teacher_stack_up.stdout or
    'Creating' in teacher_stack_up.stdout


- name: Restart ingestion so it reads the new ingestion config
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file .env
      {% for item in teacher_effective_compose_files %}-f {{ item }} {% endfor %}
      restart ingestion
    chdir: "{{ teacher_stack_dir }}"
  when: teacher_ingest_config_written is changed

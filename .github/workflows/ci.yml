name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      voice:
        description: Include the CPU voice round trip
        type: boolean
        default: false
      deploy:
        description: Deploy main to the self-hosted host (needs an online self-hosted runner)
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hun tesseract-ocr-eng

      - name: Set up Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            services/api/requirements.txt
            services/ingestion/requirements.txt
            .github/workflows/ci.yml

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --torch-backend cpu ruff mypy pytest httpx \
            -r services/api/requirements.txt -r services/ingestion/requirements.txt

      - name: Lint with ruff
        run: uv run ruff check services/

      - name: Type check with mypy
        run: uv run mypy --ignore-missing-imports services/

      - name: Run tests
        run: uv run python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    env:
      TORCH_CPU: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Prepare the Compose image targets
        run: |
          docker compose --env-file .env.example -p teacher-e2e \
            -f compose/docker-compose.yml -f compose/docker-compose.voice.example.yml \
            build --print > "$RUNNER_TEMP/teacher-bake.json"

      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          source: .
          files: ${{ runner.temp }}/teacher-bake.json
          set: |
            *.output=type=cacheonly
            api.cache-from=type=gha,scope=teacher-api
            api.cache-to=type=gha,scope=teacher-api,mode=max
            ingestion.cache-from=type=gha,scope=teacher-ingestion
            ingestion.cache-to=type=gha,scope=teacher-ingestion,mode=max
            voice.cache-from=type=gha,scope=teacher-voice
            voice.cache-to=type=gha,scope=teacher-voice,mode=max

      - name: Check the egress rule in the compose config
        env:
          TEACHER_ENABLE_VOICE: "true"
          TEACHER_ENV_FILE: .env.example
        run: bash scripts/test-egress-block.sh --config-only

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    env:
      TORCH_CPU: "true"
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Prepare the Compose image targets
        run: |
          docker compose --env-file .env.example -p teacher-e2e \
            -f compose/docker-compose.yml -f compose/docker-compose.voice.example.yml \
            build --print > "$RUNNER_TEMP/teacher-bake.json"

      - name: Load the trial images from the build cache
        uses: docker/bake-action@v6
        with:
          source: .
          files: ${{ runner.temp }}/teacher-bake.json
          targets: api,ingestion${{ inputs.voice && ',voice' || '' }}
          load: true
          set: |
            api.cache-from=type=gha,scope=teacher-api
            ingestion.cache-from=type=gha,scope=teacher-ingestion
            voice.cache-from=type=gha,scope=teacher-voice

      - name: Run the Compose trial and live egress check
        env:
          INCLUDE_VOICE: ${{ inputs.voice && 'true' || 'false' }}
        run: |
          if [ "$INCLUDE_VOICE" = true ]; then
            bash scripts/e2e.sh --voice
          else
            make test-e2e
          fi

      - name: Write the trial report to the job summary
        if: ${{ always() && hashFiles('.scratch/e2e/report.md') != '' }}
        run: cat .scratch/e2e/report.md >> "$GITHUB_STEP_SUMMARY"

  # Manual only until a self-hosted runner and a deployment exist: on push it
  # would sit queued for a runner that isn't there. Start the workflow by hand
  # on main with `deploy` ticked.
  deploy:
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Deploy with Ansible
        run: |
          umask 077
          VARS_FILE=$(mktemp)
          trap 'rm -f "$VARS_FILE"' EXIT
          printf 'teacher_auth_users: "%s"\n' "$TEACHER_AUTH_USERS" > "$VARS_FILE"
          ansible-playbook -i ansible/inventory/selfhosted.ini ansible/playbooks/deploy.yml \
            --extra-vars "@$VARS_FILE"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          TEACHER_AUTH_USERS: ${{ secrets.TEACHER_AUTH_USERS }}

      - name: Healthcheck and egress probe
        run: |
          for attempt in $(seq 1 120); do
            if ansible-playbook -i ansible/inventory/selfhosted.ini \
                 ansible/playbooks/healthcheck.yml >/dev/null 2>&1; then
              ansible-playbook -i ansible/inventory/selfhosted.ini \
                ansible/playbooks/healthcheck.yml
              exit 0
            fi
            sleep 5
          done
          docker ps --filter name=teacher-agent --format 'table {{.Names}}\t{{.Status}}'
          exit 1

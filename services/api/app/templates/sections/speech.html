<section class="panel speech" id="speech">
  <h2>Beszédgyakorlás</h2>
  <div class="sp-modes" role="group" aria-label="Gyakorlat">
    <button type="button" data-mode="talks" aria-pressed="true">Smart Talk</button>
    <button type="button" data-mode="takes" aria-pressed="false">Elevator Speech</button>
  </div>
  <fieldset id="sp-controls" disabled>
    <div class="sp-grid">
      <label>Helyzet<select id="sp-scenario"></select></label>
      <label>Nyelv<select id="sp-lang"><option value="hu">Magyar</option><option value="en">Angol</option></select></label>
      <label id="sp-style-label">Beszélgetőtárs<select id="sp-style"></select></label>
      <label id="sp-interest-label" hidden>A hallgató érdeklődése<select id="sp-interest"></select></label>
      <label id="sp-target-label" hidden>Időkeret<select id="sp-target"><option value="30">30 mp</option><option value="60">60 mp</option><option value="90">90 mp</option></select></label>
    </div>
    <p id="sp-hint"></p>
    <label id="sp-keys-label" hidden>Kulcsüzenetek (soronként egy, legfeljebb öt)<textarea id="sp-keys" rows="2" maxlength="1000"></textarea></label>
    <button id="sp-start" class="primary">Beszélgetés indítása</button>
    <div id="sp-result"></div>
    <div id="sp-entry" hidden>
      <label id="sp-prompt" for="sp-text">A válaszod</label>
      <textarea id="sp-text" rows="3" maxlength="4000"></textarea>
      <div id="sp-voice" hidden>
        <button id="sp-record" class="secondary">Mikrofon indítása</button>
        <label>Vagy válassz hangfájlt<input type="file" id="sp-file" accept="audio/*"></label>
        <output id="sp-clock"></output>
        <button id="sp-clear" hidden>Felvétel elvetése</button>
      </div>
      <div class="sp-actions"><button id="sp-send" class="primary">Válasz küldése</button><button id="sp-finish">Beszélgetés értékelése</button></div>
    </div>
    <button id="sp-retry" class="primary" hidden>Célzott újrapróbálás</button>
    <details id="sp-history"><summary>Korábbi próbák</summary><div id="sp-list"></div></details>
  </fieldset>
  <p id="sp-status" role="status"></p>
</section>

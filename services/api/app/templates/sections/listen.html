<section class="panel listen" id="listen">
  <h2>Hallgatás</h2>
  <p class="lead">A könyvtár dokumentumai felolvasva, szakaszonként. A hely mentődik, így bármelyik eszközön folytathatod.</p>
  <p id="listen-voice-off" class="notice" role="status" hidden>
    A felolvasás most nem elérhető: a hangszolgáltatás nincs bekapcsolva. A dokumentumok szövegét így is olvashatod itt, a többi funkció működik.
  </p>

  <div id="listen-library-view">
    <ul id="listen-library" class="listen-library"></ul>
    <details>
      <summary>Dokumentum hozzáadása a listához</summary>
      <label for="listen-doc-select">Dokumentum</label>
      <select id="listen-doc-select"></select>
      <button id="listen-add" type="button" class="primary">Hozzáadás</button>
    </details>
  </div>

  <div id="listen-player" hidden>
    <button id="listen-back" type="button" class="secondary">← Vissza a listához</button>
    <h3 id="listen-title"></h3>
    <p id="listen-ocr-note" class="notice" hidden></p>

    <label for="listen-section">Szakasz</label>
    <select id="listen-section"></select>

    <div class="listen-controls">
      <button id="listen-prev-section" type="button" class="secondary" aria-label="Előző szakasz">⏮</button>
      <button id="listen-prev" type="button" class="secondary" aria-label="Előző részlet">⏪</button>
      <button id="listen-play" type="button" class="primary" aria-label="Lejátszás">▶</button>
      <button id="listen-next" type="button" class="secondary" aria-label="Következő részlet">⏩</button>
      <button id="listen-next-section" type="button" class="secondary" aria-label="Következő szakasz">⏭</button>
    </div>

    <div class="listen-options">
      <div>
        <label for="listen-speed">Sebesség</label>
        <select id="listen-speed">
          <option value="0.75">0,75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1,25×</option>
          <option value="1.5">1,5×</option>
          <option value="1.75">1,75×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div>
        <label for="listen-voice">Hang</label>
        <select id="listen-voice"></select>
      </div>
    </div>
    <label class="check"><input id="listen-skip-low" type="checkbox" /> Bizonytalan OCR-szöveg kihagyása</label>
    <p id="listen-status" class="voice-status" role="status"></p>
    <progress id="listen-progress" max="1" value="0" aria-label="Haladás a szakaszban"></progress>

    <div id="listen-text" class="listen-text" aria-live="off"></div>

    <button id="listen-bookmark" type="button" class="secondary">🔖 Könyvjelző ide</button>
    <ul id="listen-bookmarks" class="listen-bookmarks"></ul>
    <audio id="listen-audio" preload="auto" hidden></audio>
  </div>
</section>

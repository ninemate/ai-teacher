<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teacher Agent</title>
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      {% if username %}
      <nav class="topbar" aria-label="Fiók">
        <span class="user">Bejelentkezve: <strong>{{ username }}</strong></span>
        <button id="logout-button" type="button" class="link-button">Kijelentkezés</button>
      </nav>
      {% endif %}
      <section class="hero">
        <p class="eyebrow">Self-hosted teacher agent</p>
        <h1>Magyar tanulósegéd a saját könyvtáradból</h1>
        <p class="lead">
          Kérdezz magyarul. A válasz a visszakeresett dokumentumrészletekre támaszkodik, és jelzi a forrásokat is.
        </p>
      </section>

      <section class="panel">
        <label for="level">Magyarázati szint</label>
        <select id="level">
          <option value="beginner">Kezdő</option>
          <option value="intermediate">Középhaladó</option>
          <option value="advanced">Haladó</option>
        </select>

        <label for="question">Kérdés</label>
        <textarea id="question" rows="5" placeholder="Például: Magyarázd el egyszerűen, mi a fotoszintézis."></textarea>

        <div class="actions">
          <button id="ask-button" type="button">Kérdezés</button>
          <button id="summary-button" type="button" class="secondary">Összefoglaló</button>
          <button id="quiz-button" type="button" class="secondary">Mini kvíz</button>
          <button id="flashcards-button" type="button" class="secondary">Villámkártyák</button>
        </div>
      </section>

      <section class="panel output">
        <h2>Válasz</h2>
        <div id="answer">Még nincs válasz.</div>
        <h3>Források</h3>
        <ul id="sources"></ul>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>

# Optional second Ollama instance on its own GPU, e.g. a small fast model for
# translation next to the chat model on another card. Use with the NVIDIA overlay:
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.example.yml \
#     -f docker-compose.ollama-second.nvidia.example.yml up -d
# It stays on the private network with cloud features off, like the main instance.
# The app reads one OLLAMA_BASE_URL; point it (or a feature that takes its own URL)
# at http://ollama-second:11434 to use this instance. See docs/model-selection.md.
services:
  ollama-second:
    image: ollama/ollama:0.6.6
    restart: unless-stopped
    networks: [private]
    expose:
      - "11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_UPDATE_CHECK: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ${TEACHER_DATA_DIR}/ollama-second:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OLLAMA_SECOND_GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    networks: [private]
    expose:
      - "6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${TEACHER_DATA_DIR}/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:0.6.6
    restart: unless-stopped
    networks: [private]
    expose:
      - "11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_UPDATE_CHECK: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ${TEACHER_DATA_DIR}/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    networks: [private]
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_ROLE: api
      LIBRARY_PATH: /library
      METADATA_DB_URL: sqlite:////data/metadata/teacher.db
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE}
      TEACHER_PROMPT_PATH: /app/config/prompts/teacher_hu.md
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS}
      STUDY_TOP_K: ${STUDY_TOP_K:-10}
      STUDY_MAX_ATTEMPTS: ${STUDY_MAX_ATTEMPTS:-2}
      TEACHER_AUTH_USERS: ${TEACHER_AUTH_USERS:-}
      TEACHER_AUTH_USERS_FILE: ${TEACHER_AUTH_USERS_FILE:-}
      TEACHER_AUTH_DISABLED: ${TEACHER_AUTH_DISABLED:-false}
      TEACHER_SESSION_TTL_HOURS: ${TEACHER_SESSION_TTL_HOURS:-720}
      TEACHER_COOKIE_SECURE: ${TEACHER_COOKIE_SECURE:-auto}
      TEACHER_LOGIN_MAX_ATTEMPTS: ${TEACHER_LOGIN_MAX_ATTEMPTS:-10}
      TEACHER_LOGIN_WINDOW_SECONDS: ${TEACHER_LOGIN_WINDOW_SECONDS:-900}
      TEACHER_INGEST_TOKEN: ${TEACHER_INGEST_TOKEN:-}
      INGESTION_BASE_URL: http://ingestion:8081
      VOICE_BASE_URL: ${VOICE_BASE_URL}
    volumes:
      - ${TEACHER_MOUNT_POINT}:/library:ro
      - ${TEACHER_DATA_DIR}/metadata:/data/metadata
      - ${TEACHER_DATA_DIR}/logs:/data/logs
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5

  ingestion:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    networks: [private]
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      APP_ROLE: ingestion
      LIBRARY_PATH: /library
      METADATA_DB_URL: sqlite:////data/metadata/teacher.db
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE}
      INGEST_CONFIG_PATH: ${INGEST_CONFIG_PATH:-/app/config/ingestion/ingestion.yml}
      INGEST_SCHEDULE_SECONDS: ${INGEST_SCHEDULE_SECONDS}
      INGEST_REMOVE_MISSING: ${INGEST_REMOVE_MISSING}
      INGEST_SCAN_EXTENSIONS: ${INGEST_SCAN_EXTENSIONS}
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP}
      TEACHER_INGEST_TOKEN: ${TEACHER_INGEST_TOKEN:-}
      OCR_ENABLED: ${OCR_ENABLED}
      OCR_DPI: ${OCR_DPI}
      OCR_LANGUAGE: ${OCR_LANGUAGE}
      OCR_MIN_CHARS: ${OCR_MIN_CHARS:-50}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-900}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-0}
      OCR_CACHE_DIR: ${OCR_CACHE_DIR:-/data/metadata/ocr_cache}
    volumes:
      - ${TEACHER_MOUNT_POINT}:/library:ro
      - ${TEACHER_DATA_DIR}/metadata:/data/metadata
      - ${TEACHER_DATA_DIR}/logs:/data/logs
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5

  egress_probe:
    # Disposable container used by scripts/test-egress-block.sh (make test-egress, "Private AI"
    # acceptance test 11): it joins the private network and must fail to reach the internet.
    image: busybox:1.36
    profiles: ["egress-test"]
    networks: [private]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        blocked=0
        probe() {
          # $$1 what, $$2 address, $$3 port. Reaching the internet from the private network
          # breaks the egress rule, so the test fails then. ($$ must be doubled here:
          # compose would otherwise substitute them while loading the file.)
          if nc -z -w 4 "$$2" "$$3" 2>/dev/null; then
            echo "FAIL: $$1 ($$2:$$3) is reachable from the private network" >&2
            blocked=1
          else
            echo "ok: $$1 ($$2:$$3) unreachable (blocked, as it should be)"
          fi
        }
        probe "TCP to a resolver" 9.9.9.9 53
        probe "TCP to Google DNS" 8.8.8.8 53
        probe "TCP to Cloudflare HTTPS" 1.1.1.1 443
        if nslookup example.com 9.9.9.9 >/dev/null 2>&1; then
          echo "FAIL: DNS query to 9.9.9.9 answered" >&2
          blocked=1
        else
          echo "ok: DNS to 9.9.9.9 blocked"
        fi
        # Informational: from this container the stack's own services should be reachable
        # (they live on the same private network). Nobody is expected to be up for a bare probe.
        (nc -z -w 2 qdrant 6333 2>/dev/null && echo "in-network: qdrant:6333 reachable") \
          || echo "in-network: qdrant:6333 not reachable (stack not up)"
        if [ "$$blocked" -eq 0 ]; then
          echo "PASS: no egress to the internet from the private network"
        else
          echo "FAIL: the private network reached the internet" >&2
        fi
        exit "$$blocked"

networks:
  # Edge network for the published ports (the reverse proxy only).
  default:
    name: ${COMPOSE_PROJECT_NAME}
  # Everything carrying private content (api, ingestion, voice, qdrant, ollama) sits here.
  # internal: true means no route to the internet, so no private service can reach
  # an external AI cloud (rough equivalent: docker network create --internal).
  private:
    name: ${COMPOSE_PROJECT_NAME}_private
    internal: true

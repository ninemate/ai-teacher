services:
  voice:
    build:
      context: ..
      dockerfile: services/voice/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      VOICE_STT_BACKEND: ${VOICE_STT_BACKEND}
      VOICE_TTS_BACKEND: ${VOICE_TTS_BACKEND}
      VOICE_STT_MODEL: ${VOICE_STT_MODEL}
      VOICE_STT_DEVICE: ${VOICE_STT_DEVICE}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    environment:
      VOICE_BASE_URL: http://voice:8090


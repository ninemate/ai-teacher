services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OLLAMA_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

  api:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${API_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

  ingestion:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${INGESTION_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
